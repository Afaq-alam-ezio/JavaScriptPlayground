<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #0f0f0f; color: rgb(234, 240, 238); font-size: 25px;">

    <div id = "heading" style="display: flex; justify-content: center; margin-top: 300px;">
        <h1 >Assasin's Creed 1</h1>
    </div>

    <div id = "button" style="display: flex; justify-content: center; align-items: center;">
        <button id="stop" >Stop</button>
    </div>
</body>
<script>
    
    let changeTitle = function(){

                document.querySelector('#heading').innerHTML = "Assassin's Creed Brotherhood";
                console.log("changed");
            }

    let change = setTimeout(changeTitle, 3000);

    document.getElementById('stop').addEventListener('click', function(){

        clearTimeout(change);
        console.log("stopped");
    }, false);

</script>
</html>
