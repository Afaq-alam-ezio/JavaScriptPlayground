<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="id" style="border: 2px solid black; width: 400px; margin: 100px auto; text-align: center; padding: 30px;">

        <h2>Profile id card</h2>
        <div id="avatar" style="margin-top: 20px;"></div>
      
        <div id="followers" style="margin-top: 20px; font-weight: bold; font-size: 1.2rem;"></div>
      
      </div>

</body>
<script>

    let url = "https://api.github.com/users/Afaq-alam-ezio";
    let res = new XMLHttpRequest();
    res.open('GET', url);
    res.onreadystatechange = function(){

        console.log(res.readyState);
        if(res.readyState === 4){

            let data = JSON.parse(res.responseText);
            console.log("followers = " + data.followers);

            let photo = document.getElementById('avatar');
            let follower = document.getElementById('followers');

            photo.innerHTML = `<img src = ${data.avatar_url}>`;
            follower.innerHTML = `Followers = ${data.followers}`;
        }
    }

    res.send();

</script>
</html>
